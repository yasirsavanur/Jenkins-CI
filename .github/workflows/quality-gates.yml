name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    name: Python and Chrome validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Run unit tests
        run: pytest -m unit --junitxml=reports/framework.xml
      - name: Run acceptance tests
        run: >-
          pytest -m "smoke or regression or mobile"
          --target=local
          --browser=chrome
          --junitxml=reports/acceptance.xml
          --html=reports/report.html
          --self-contained-html
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: reports/
          if-no-files-found: ignore
